# 单仓部署：推送 master -> GitHub Actions 构建 -> rsync 镜像到宝塔服务器。
#
# 参照同工作区 Shirone 仓的 deploy.yml 裁剪而来：本仓为单仓文档站，
# 无内容仓派发环节，push 即构建。
#
# 完整构建约需 20GB 内存（build 脚本 --max-old-space-size=20480），
# 而 GitHub 标准 runner 仅 16GB，因此构建前在 /mnt 附加 16GB swap 补足。
#
# 所需 Secrets（Settings -> Secrets and variables -> Actions）：
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY —— 服务器 SSH 凭据（专用部署公钥）
#   DEPLOY_DIR —— 站点子路径目录，如 /www/wwwroot/shironeadmin.evocosmos.com/public/shironeadmin
#   DEPLOY_PORT —— 可选，默认 22

name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "README*.md"
      - "CLAUDE.md"
      - ".claude/**"
  workflow_dispatch: {}

# 并发控制：连续推送只保留最新一次构建，自动取消正在进行的旧构建，
# 确保线上始终与最新提交一致。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      # 前置校验：Secret 缺失时快速失败，避免白白跑完 20 多分钟构建。
      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "$DEPLOY_HOST" ] || { echo "::error::缺少 Secret：DEPLOY_HOST" >&2; missing=1; }
          [ -n "$DEPLOY_USER" ] || { echo "::error::缺少 Secret：DEPLOY_USER" >&2; missing=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::缺少 Secret：DEPLOY_SSH_KEY" >&2; missing=1; }
          [ -n "$DEPLOY_DIR" ] || { echo "::error::缺少 Secret：DEPLOY_DIR" >&2; missing=1; }
          [ "$missing" -eq 0 ]

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # V8 堆上限 20480MB 高于 runner 物理内存，用 /mnt（剩余磁盘空间最大）
      # 上的 swap 文件补足，避免构建中后期 OOM 被内核杀死。
      - name: Add swap space
        run: |
          set -euo pipefail
          if ! swapon --show --noheadings | grep -q .; then
            sudo fallocate -l 16G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi
          free -h

      - name: Restore build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Vite 持久缓存按内容哈希复用，跨 commit 命中安全有效。
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build site
        run: pnpm build

      # rsync 镜像部署：增量传输 + --delete 清除陈旧文件，幂等可重跑。
      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$port" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR'"
          rsync -az --delete -e "ssh -p $port -i ~/.ssh/deploy_key" \
            docs/.vitepress/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone-Admin-API deploy"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 分支：\`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
